<noscript><div style="color:#FFF8EC;padding:24px;font-size:20px;line-height:1.8;position:relative;z-index:30;background:#1B1714"><h1>《讓生命乘著歌聲，綻放成一道彩虹》</h1><p>山腳下有一座小村莊，住著一位大家都叫他「黑狗兄」的男子。他熱心、愛笑，也愛唱歌，常和三位好友跑到山頂，對著山谷唱得忘了時間。</p><p>黑狗兄一直有個願望：「哪一天，我們要辦一場音樂會，讓整個村莊的人都來唱歌！」好友們笑著答應，四個人的聲音，就這樣帶著夢想飄下山。</p><h2>第一首〈山頂的黑狗兄〉四重唱</h2><p>這一天，黑狗兄沿著鄉間小路回家，忽然看見一個熟悉的身影。</p><p>那是多年不見的阿晴。她曾離開家鄉，到外地學音樂，如今提著行李，回到了這條從小走到大的路。</p><p>兩人並肩走過田野，聊起童年的往事。當阿晴聽見黑狗兄想辦音樂會，眼睛立刻亮了起來：「這麼好的事，怎麼可以少了我？」</p><h2>第二首〈鄉間小路〉合唱</h2><p>隔天，黑狗兄穿著一件黃襯衫，來到村口等阿晴。</p><p>阿晴一看便笑了：「這件衣服，你還留著呀？」</p><p>那是她離鄉前送給他的禮物。黑狗兄抓抓頭，害羞地說：「我一直想穿著它，唱歌給妳聽。」</p><p>朋友們聽見了，立刻敲起鼓來起鬨。黑狗兄紅著臉，跟著節奏踏步、擺動，阿晴也加入其中。兩人多年沒說出口的心意，都藏在這場熱鬧的鼓聲裡。</p><h2>第三首〈情人的黃襯衫〉非洲鼓＋擊鼓有氧</h2><p>有了阿晴的支持，黑狗兄終於決定把夢想付諸行動。</p><p>阿晴牽起他的手，說：「請跟我來，我知道一個好地方。」</p><p>她帶大家來到村裡的老學堂。這裡有寬敞的庭院，還有一棵能替人遮蔭的大樹，正適合練唱。</p><p>他們挨家挨戶邀請鄰居。起初，有人說自己唱不好，有人害羞得不敢進門；但聽著屋裡傳出的歌聲，大家漸漸走了進來，空蕩蕩的學堂也重新熱鬧起來。</p><h2>第四首〈請跟我來〉合唱</h2><p>學堂外有一片多年沒人照顧的玫瑰花圃。大家練唱之餘，也一起除草、澆水，想讓來看音樂會的人，一進門就看見花。</p><p>第一朵玫瑰綻放時，阿晴高興地喊來所有人。孩子們圍著花圃跳舞，大人們敲鼓、踏步，連平常最安靜的鄰居都跟著伸手、轉身。</p><p>黑狗兄望著笑得燦爛的阿晴，悄悄摘下一朵玫瑰，別在自己的黃襯衫上：「演出那天，我就戴著它上台。」</p><h2>第五首〈可愛的玫瑰花〉非洲鼓＋擊鼓有氧</h2><p>可是，音樂會前夕，一場大雨打亂了所有準備。庭院積了水，布置好的舞台也被風吹倒。</p><p>黑狗兄看著滿地狼藉，難過地說：「忙了這麼久，還是辦不成嗎？」</p><p>阿晴沒有回答，只先扶起一張倒下的椅子。接著，三位好友來了，鄰居也帶著工具來了。有人修舞台，有人清掃，有人替大家準備熱茶。</p><p>熟悉的歌聲再次響起。黑狗兄捲起袖子，走進人群，和大家一起把夢想重新扶了起來。</p><h2>第六首〈追夢人〉合唱</h2><p>音樂會當天，雨終於停了。</p><p>老學堂掛上彩帶，玫瑰花圃旁排滿椅子。村民帶著家人陸續入座，台上的每一個人，都能在台下找到熟悉的笑臉。</p><p>黑狗兄穿著黃襯衫，胸前別著那朵玫瑰。他站在阿晴身旁，小聲說：「以後每一場音樂會，妳都陪我，好嗎？」</p><p>阿晴笑著點頭。掌聲響起，大家一起唱出了這段日子裡，親手忙出來的幸福。</p><h2>第七首〈幸福進行曲〉合唱</h2><p>最後一首曲子開始前，一個孩子指著天空大喊：「彩虹！」</p><p>大家抬起頭，看見一道彩虹跨過山頂，正是黑狗兄和好友們最初唱歌的地方。</p><p>鼓聲響起，台上的人踏著節奏揮動雙手，台下的觀眾也站起來加入。黑狗兄牽著阿晴，和全村的人一起跳躍、歡笑。</p><p>從山頂的一個願望，到今天滿院子的歌聲，他們終於完成了那場音樂會。</p><p>而彩虹下，已經有人開始問：「明年，我們還要唱什麼歌？」</p><h2>第八首〈飛躍的彩虹〉非洲鼓＋擊鼓有氧</h2></div></noscript>

瑰開了，孩子們圍著花圃跳舞，大人們敲鼓踏步。","lines":["第一朵玫瑰綻放時，阿晴高興地喊來所有人。","孩子們圍著花圃跳舞，大人們敲鼓、踏步，","連平常最安靜的鄰居都跟著伸手、轉身。"],"text":"第一朵玫瑰綻放時，阿晴高興地喊來所有人。孩子們圍著花圃跳舞，大人們敲鼓、踏步，連平常最安靜的鄰居都跟著伸手、轉身。","tag":"5／8〈可愛的玫瑰花〉","box":[96,678,1728,378]},{"id":"c5c","k":"story","img":"c5c","alt":"黑狗兄把一朵玫瑰別在黃襯衫上，阿晴笑得很燦爛。","lines":["黑狗兄望著笑得燦爛的阿晴，悄悄摘下一朵玫瑰，","別在自己的黃襯衫上：「演出那天，","我就戴著它上台。」"],"text":"黑狗兄望著笑得燦爛的阿晴，悄悄摘下一朵玫瑰，別在自己的黃襯衫上：「演出那天，我就戴著它上台。」","tag":"5／8〈可愛的玫瑰花〉","box":[96,678,1728,378]},{"id":"s5","k":"song","img":"s5","alt":"盛開的玫瑰花圃，花瓣隨著鼓聲飛舞，大家一起跳舞。","label":"第五首","song":"可愛的玫瑰花","form":"非洲鼓＋擊鼓有氧","tag":"5／8"},{"id":"c6a","k":"story","img":"c6a","alt":"大雨的夜裡，庭院積水，舞台被風吹倒，椅子也倒了。","lines":["可是，音樂會前夕，一場大雨打亂了所有準備。","庭院積了水，布置好的舞台也被風吹倒。"],"text":"可是，音樂會前夕，一場大雨打亂了所有準備。庭院積了水，布置好的舞台也被風吹倒。","tag":"6／8〈追夢人〉","box":[96,780,1728,276]},{"id":"c6b","k":"story","img":"c6b","alt":"黑狗兄站在雨中，看著滿地狼藉，難過地低著頭。","lines":["黑狗兄看著滿地狼藉，難過地說：「忙了這麼久，","還是辦不成嗎？」"],"text":"黑狗兄看著滿地狼藉，難過地說：「忙了這麼久，還是辦不成嗎？」","tag":"6／8〈追夢人〉","box":[96,780,1728,276]},{"id":"c6c","k":"story","img":"c6c","alt":"阿晴扶起一張椅子，好友和鄰居帶著工具來幫忙，有人端來熱茶。","lines":["阿晴沒有回答，只先扶起一張倒下的椅子。接著，","三位好友來了，鄰居也帶著工具來了。有人修舞台，","有人清掃，有人替大家準備熱茶。"],"text":"阿晴沒有回答，只先扶起一張倒下的椅子。接著，三位好友來了，鄰居也帶著工具來了。有人修舞台，有人清掃，有人替大家準備熱茶。","tag":"6／8〈追夢人〉","box":[96,678,1728,378]},{"id":"c6d","k":"story","img":"c6d","alt":"雨快停了，大家一邊唱歌，一邊把舞台重新扶起來。","lines":["熟悉的歌聲再次響起。黑狗兄捲起袖子，走進人群，","和大家一起把夢想重新扶了起來。"],"text":"熟悉的歌聲再次響起。黑狗兄捲起袖子，走進人群，和大家一起把夢想重新扶了起來。","tag":"6／8〈追夢人〉","box":[96,780,1728,276]},{"id":"s6","k":"song","img":"s6","alt":"星空下重新搭好的舞台，大家仰望天空唱歌，流星劃過。","label":"第六首","song":"追夢人","form":"合唱","tag":"6／8"},{"id":"c7a","k":"story","img":"c7a","alt":"雨停了，藍天出太陽，水窪映著天空，玫瑰上掛著水珠。","lines":["音樂會當天，雨終於停了。"],"text":"音樂會當天，雨終於停了。","tag":"7／8〈幸福進行曲〉","box":[96,882,1728,174]},{"id":"c7b","k":"story","img":"c7b","alt":"老學堂掛上彩帶，玫瑰花圃旁排滿椅子，村民帶著家人入座。","lines":["老學堂掛上彩帶，玫瑰花圃旁排滿椅子。","村民帶著家人陸續入座，台上的每一個人，","都能在台下找到熟悉的笑臉。"],"text":"老學堂掛上彩帶，玫瑰花圃旁排滿椅子。村民帶著家人陸續入座，台上的每一個人，都能在台下找到熟悉的笑臉。","tag":"7／8〈幸福進行曲〉","box":[96,678,1728,378]},{"id":"c7c","k":"story","img":"c7c","alt":"台上，胸前別著玫瑰的黑狗兄站在阿晴身旁，小聲說話。","lines":["黑狗兄穿著黃襯衫，胸前別著那朵玫瑰。","他站在阿晴身旁，小聲說：「以後每一場音樂會，","妳都陪我，好嗎？」"],"text":"黑狗兄穿著黃襯衫，胸前別著那朵玫瑰。他站在阿晴身旁，小聲說：「以後每一場音樂會，妳都陪我，好嗎？」","tag":"7／8〈幸福進行曲〉","box":[96,678,1728,378]},{"id":"c7d","k":"story","img":"c7d","alt":"阿晴笑著點頭，台下的人鼓掌，彩紙飄落。","lines":["阿晴笑著點頭。掌聲響起，","大家一起唱出了這段日子裡，親手忙出來的幸福。"],"text":"阿晴笑著點頭。掌聲響起，大家一起唱出了這段日子裡，親手忙出來的幸福。","tag":"7／8〈幸福進行曲〉","box":[96,780,1728,276]},{"id":"s7","k":"song","img":"s7","alt":"掛滿彩帶的舞台上，大家一起唱歌，彩紙飛舞。","label":"第七首","song":"幸福進行曲","form":"合唱","tag":"7／8"},{"id":"c8a","k":"story","img":"c8a","alt":"庭院裡，一個孩子站在椅子上，指著天空大喊。","lines":["最後一首曲子開始前，","一個孩子指著天空大喊：「彩虹！」"],"text":"最後一首曲子開始前，一個孩子指著天空大喊：「彩虹！」","tag":"8／8〈飛躍的彩虹〉","box":[96,780,1728,276]},{"id":"c8b","k":"story","img":"c8b","alt":"一道彩虹跨過山頂，就是當初四個好友唱歌的那座山。","lines":["大家抬起頭，看見一道彩虹跨過山頂，","正是黑狗兄和好友們最初唱歌的地方。"],"text":"大家抬起頭，看見一道彩虹跨過山頂，正是黑狗兄和好友們最初唱歌的地方。","tag":"8／8〈飛躍的彩虹〉","box":[96,780,1728,276]},{"id":"c8c","k":"story","img":"c8c","alt":"鼓聲中，全村的人一起跳躍，黑狗兄牽著阿晴。","lines":["鼓聲響起，台上的人踏著節奏揮動雙手，","台下的觀眾也站起來加入。黑狗兄牽著阿晴，","和全村的人一起跳躍、歡笑。"],"text":"鼓聲響起，台上的人踏著節奏揮動雙手，台下的觀眾也站起來加入。黑狗兄牽著阿晴，和全村的人一起跳躍、歡笑。","tag":"8／8〈飛躍的彩虹〉","box":[96,678,1728,378]},{"id":"c8d","k":"story","img":"c8d","alt":"從山頂到滿院子的人，音符連成一條線，彩虹掛在天上。","lines":["從山頂的一個願望，到今天滿院子的歌聲，","他們終於完成了那場音樂會。"],"text":"從山頂的一個願望，到今天滿院子的歌聲，他們終於完成了那場音樂會。","tag":"8／8〈飛躍的彩虹〉","box":[96,780,1728,276]},{"id":"c8e","k":"story","img":"c8e","alt":"彩虹下，村民聊著天，有人問明年要唱什麼歌。","lines":["而彩虹下，已經有人開始問：「明年，","我們還要唱什麼歌？」"],"text":"而彩虹下，已經有人開始問：「明年，我們還要唱什麼歌？」","tag":"8／8〈飛躍的彩虹〉","box":[96,780,1728,276]},{"id":"s8","k":"song","img":"s8","alt":"彩虹跨過山頂，大家敲著鼓一起跳起來。","label":"第八首","song":"飛躍的彩虹","form":"非洲鼓＋擊鼓有氧","tag":"8／8"},{"id":"end","k":"end","img":"end","alt":"黃昏的彩虹跨過山頂和村莊，音符和光點飄在空中。","title":"《讓生命乘著歌聲，綻放成一道彩虹》","credits":["115年臺中市大人讀冊吧－銀向學習計畫之創齡無極限方案","《鼓動青春．樂齡飛揚》聲聲飛揚－動聲合唱課程","114–116 年朝陽科大USR計畫　北溝富麗 文化生態共榮村"]}]}</script>

  function src(p){ return 'assets/' + p.img + (RM.matches ? '.png' : '.gif'); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function nb(s){ return esc(s).replace(/(黑狗兄|阿晴)/g, '<span class="nb">$1</span>'); }
  function fit(){ stage.style.transform = 'scale(' + (frame.clientWidth / 1920) + ')'; }
  window.addEventListener('resize', fit); fit();

  function preload(i){
    if (i < 0 || i >= N) return;
    var u = src(P[i]); if (keep[u]) return;
    var im = new Image(); im.src = u; keep[u] = im;
  }
  function swapBg(p){
    var u = src(p), t = ++token, back = bgs[1 - front];
    var im = keep[u] || new Image(); keep[u] = im; if (!im.src) im.src = u;
    var go = function(){
      if (t !== token) return;
      back.src = u; back.alt = '';
      back.classList.add('on'); bgs[front].classList.remove('on'); front = 1 - front;
    };
    if (im.decode) im.decode().then(go, go); else if (im.complete) go(); else im.onload = go;
  }
  function overlay(p){
    var h = '';
    if (p.k === 'story'){
      var b = p.box;
      h += '<div class="tag">' + esc(p.tag) + '</div>';
      h += '<div class="card" style="left:' + b[0] + 'px;top:' + b[1] + 'px;width:' + b[2] + 'px;height:' + b[3] + 'px">' +
           p.lines.map(function(l){ return '<span class="ln">' + esc(l) + '</span>'; }).join('') + '</div>';
    } else if (p.k === 'song'){
      h += '<div class="songbox"><div class="label">' + esc(p.label) + '</div><div class="title">〈' + esc(p.song) + '〉</div><div class="form">' + esc(p.form) + '</div></div>';
    } else {
      h += '<div class="titlebox"><h1>' + esc(p.title) + '</h1></div><div class="credits">' +
           p.credits.map(function(c, i){ return '<div class="c' + i + '">' + esc(c) + '</div>'; }).join('') + '</div>';
    }
    var old = stage.querySelectorAll('.ov');
    old.forEach(function(o){ o.classList.add('leaving'); setTimeout(function(){ o.remove(); }, 320); });
    var d = document.createElement('div'); d.className = 'ov'; d.innerHTML = h; stage.appendChild(d);
  }
  function belowHtml(p){
    if (p.k === 'story') return '<span class="btag">' + esc(p.tag) + '</span><p>' + nb(p.text) + '</p>';
    if (p.k === 'song') return '<div class="blabel">' + esc(p.label) + '</div><div class="btitle">〈' + esc(p.song) + '〉</div><span class="bform">' + esc(p.form) + '</span>';
    return '<h1>' + esc(p.title) + '</h1><div class="bcred">' + p.credits.map(esc).join('<br>') + '</div>';
  }
  function show(i){
    i = Math.max(0, Math.min(N - 1, i));
    if (i === cur) return;
    var p = P[i], prev = cur >= 0 ? P[cur] : null;
    cur = i;
    if (!prev || prev.img !== p.img || bgs[front].getAttribute('src') !== src(p)) swapBg(p);
    frame.setAttribute('aria-label', p.alt);
    overlay(p);
    below.innerHTML = belowHtml(p);
    $('#count').textContent = (i + 1) + ' / ' + N;
    $('#bar').style.width = ((i + 1) / N * 100) + '%';
    if (history.replaceState) history.replaceState(null, '', '#' + (i + 1));
    preload(i + 1); preload(i + 2); preload(i - 1);
  }
  function next(){ hideHint(); show(cur + 1); }
  function prev(){ hideHint(); show(cur - 1); }
  function fullscreen(){
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function(){});
    else if (document.exitFullscreen) document.exitFullscreen();
  }
  var hintT = setTimeout(hideHint, 5000);
  function hideHint(){ clearTimeout(hintT); $('#hint').classList.add('gone'); }

  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(N - 1); }
    else if (k === 'f' || k === 'F') { fullscreen(); }
    else if (k === 'b' || k === 'B' || k === '.') { $('#black').classList.toggle('on'); }
    wake();
  });
  frame.addEventListener('click', function(e){
    var r = frame.getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.15) prev(); else next();
  });
  $('#black').addEventListener('click', function(){ $('#black').classList.remove('on'); });
  $('#prev').addEventListener('click', function(e){ e.stopPropagation(); prev(); });
  $('#next').addEventListener('click', function(e){ e.stopPropagation(); next(); });
  $('#fs').addEventListener('click', function(e){ e.stopPropagation(); fullscreen(); });
  var tx = null, ty = null;
  frame.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
  frame.addEventListener('touchend', function(e){
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); if (dx < 0) next(); else prev(); }
  });
  var idleT = null;
  function wake(){ ui.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function(){ ui.classList.add('idle'); }, 2600); }
  document.addEventListener('mousemove', wake); wake();
  window.addEventListener('hashchange', function(){ var n = parseInt(location.hash.slice(1), 10); if (n >= 1) show(n - 1); });
  var n0 = parseInt(location.hash.slice(1), 10);
  show(n0 >= 1 && n0 <= N ? n0 - 1 : 0);
  window.__deck = { show: show, cur: function(){ return cur; }, N: N };
})();
</script>
</body>
